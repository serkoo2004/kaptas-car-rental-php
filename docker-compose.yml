services:
  mysql:
    image: mysql:8.4
    container_name: kaptas-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kaptas
      MYSQL_USER: kaptas
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in your private environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your private environment}
    ports:
      - "3306:3306"
    volumes:
      - kaptas_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  kaptas_mysql_data:
